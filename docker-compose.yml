version: "3.9"
services:
  trading-engine:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=dynamodb,s3,sns
      - AWS_DEFAULT_REGION=ap-south-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
