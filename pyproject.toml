[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "option-trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect==5.0.1",
    "pandas>=2.0",
    "pyotp>=2.9",
    "requests>=2.32",
    "scipy>=1.14",
    "selenium>=4.22",
    "pydantic-settings>=2.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/option_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
